<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#012b76">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>CyberHayde console</title><link rel="icon" id="fav">
<style>
:root{--navy:#012b76;--orange:#fd8402;--paper:#f3f5fa;--card:#fff;--ink:#012b76;--mute:#5b6a86;--line:#d6dce8;--ok:#14803c;--warn:#b86e00;--bad:#b3261e;--info:#2456b8;--r:12px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(760px 380px at 100% -8%,#ffe8d0 0,transparent 60%),var(--paper);min-height:100vh;min-height:100dvh;color:var(--ink);font:15px/1.5 Bahnschrift,"Avenir Next","Segoe UI",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea,select{font:inherit;color:inherit}
h2,h3{line-height:1.25}
a{color:var(--info)}
/* header */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px clamp(12px,3vw,24px);padding-top:calc(10px + env(safe-area-inset-top));background:var(--navy);color:#fff;border-bottom:4px solid var(--orange)}
header img{width:38px;height:38px;border-radius:50%;flex:0 0 auto}
header b{font-size:19px;letter-spacing:.2px}header b em{font-style:normal;color:var(--orange)}
header .sub{opacity:.7;font-size:13px}
header .sp{flex:1}
#syncState{font-size:12px;opacity:.85;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#syncState.bad{color:#ffb4a8;opacity:1}
header button{background:transparent;color:#fff;border-color:#fff6;padding:6px 12px;min-height:36px}
main{max-width:1100px;margin:0 auto;padding:clamp(12px,3vw,24px)}
/* controls */
button{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:9px 16px;min-height:42px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}
button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
button.go,#go,#add,#sv,#save,#up{background:var(--orange);border-color:var(--orange);color:#1b1b1b;font-weight:700}
button:disabled{opacity:.55;cursor:progress}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
input,textarea,select{display:block;width:100%;padding:10px 12px;min-height:44px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:#fff}
label{display:block;margin:14px 0 4px;font-weight:600;font-size:13.5px}
small,.mute{color:var(--mute)}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:clamp(14px,3vw,20px);margin-bottom:14px;box-shadow:0 10px 24px -18px #012b7680}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.actions button{flex:0 1 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:0 16px}
/* sign-in card */
.gate{max-width:440px;margin:clamp(12px,6vh,56px) auto;position:relative;overflow:hidden;animation:rise .45s ease both}
.gate::before{content:'';position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--navy) 0 55%,var(--orange) 55%)}
.gate .em{width:96px;height:96px;border-radius:50%;margin:8px auto 4px;display:block}
.gate h2{color:var(--navy);text-align:center;margin:6px 0}
.gate .hint{text-align:center;margin:0 0 6px}
.gate .actions button{flex:1 1 100%}
.gate .alt{text-align:center;margin:14px 0 0}
.err{color:var(--bad);font-weight:600;min-height:1.2em;margin:8px 0 0}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@media(prefers-reduced-motion:reduce){.gate{animation:none}}
/* client list */
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.top h2{margin:0;flex:1 1 160px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.client{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:8px solid var(--mute);border-radius:10px;padding:14px 16px;min-height:96px;position:relative}
.client.active{border-left-color:var(--ok)}.client.expiring,.client.grace{border-left-color:var(--warn)}.client.expired,.client.suspended,.client.err{border-left-color:var(--bad)}
.client h3{margin:0;font-size:17px;padding-right:90px;overflow-wrap:anywhere}
.client .badge{position:absolute;top:12px;right:12px}
.client .rm{align-self:flex-start;font-size:13px;color:var(--bad);text-decoration:underline;padding:6px 0;cursor:pointer}
.badge{font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:99px;background:#e6ebf2}
.badge.active{background:#dff3e6;color:var(--ok)}.badge.expiring,.badge.grace{background:#fdecd0;color:var(--warn)}.badge.expired,.badge.suspended{background:#fbdcd9;color:var(--bad)}
/* tabs */
.tabs{display:flex;gap:6px;margin:14px 0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;background:transparent;color:var(--ink);border-color:var(--line);white-space:nowrap}
.tabs button.on{background:var(--navy);color:#fff;box-shadow:inset 0 -3px var(--orange)}
/* tables that turn into cards on small screens */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.3px}
td .row{gap:6px}
td button{min-height:36px;padding:6px 12px}
#toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none;padding:0 12px}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;max-width:min(92vw,460px);pointer-events:auto}
.toast.err{background:var(--bad)}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:50}
.modal img{max-width:100%;max-height:85vh;background:#fff}
.sheet{position:fixed;inset:0;z-index:55;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet .box{width:100%;max-width:460px;margin:0;max-height:92dvh;overflow:auto}
pre{white-space:pre-wrap;background:#f6f8fa;padding:10px;border-radius:6px;overflow:auto}
#bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:99;overflow:hidden;opacity:0;transition:opacity .2s;pointer-events:none}
#bar.on{opacity:1}#bar::before{content:'';position:absolute;inset:0;width:40%;background:var(--orange);animation:bar 1s ease-in-out infinite}
@keyframes bar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
/* phones */
@media(max-width:640px){
  body{font-size:15px}
  header .sub{display:none}
  header{gap:8px}
  header button{padding:6px 10px;min-height:36px;font-size:14px}
  #syncState{max-width:34vw}
  .actions button,.top>button{flex:1 1 140px}
  .rt thead{display:none}
  .rt,.rt tbody,.rt tr,.rt td{display:block;width:100%}
  .rt tr{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:4px 0;background:#fff}
  .rt td{display:flex;justify-content:space-between;gap:12px;border:0;padding:6px 12px;text-align:right}
  .rt td::before{content:attr(data-l);flex:0 0 38%;text-align:left;color:var(--mute);font-size:12.5px;text-transform:uppercase;letter-spacing:.3px}
  .rt td[colspan]{display:block;text-align:left}.rt td[colspan]::before{content:none}
  .rt td .v{text-align:right;min-width:0;overflow-wrap:anywhere}
  .rt td .row{justify-content:flex-end}
  .sheet{align-items:flex-end;padding:0}.sheet .box{max-width:none;border-radius:18px 18px 0 0}
}
@media(max-width:520px){#syncState:not(.bad){display:none}}
@media(max-height:520px){.gate{margin-top:8px}.gate .em{width:56px;height:56px}}

.rk{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;font:700 clamp(17px,5vw,22px)/1.4 ui-monospace,Consolas,Menlo,monospace;letter-spacing:.08em;background:#fff8ec;border:2px dashed var(--orange);border-radius:10px;padding:14px 10px;margin:12px 0;user-select:all}
.rk span{white-space:nowrap}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:14px 0 0}.chk input{width:20px;min-height:20px;height:20px;margin:2px 0 0;flex:0 0 20px}
.ver{text-align:center;margin:10px 0 0;opacity:.7}
.sheet h4{margin:18px 0 6px}
@media print{header,.actions,.alt,.ver,.hint,h2,.em,.chk,.err,#toasts{display:none!important}.gate{box-shadow:none;border:0}.rk{border-color:#000}}
</style></head><body>

 async set(k,v){try{const d=await IDB.db();await new Promise(res=>{const t=d.transaction('s','readwrite');t.objectStore('s').put(v,k);t.oncomplete=res;t.onerror=res;t.onabort=res;});}catch(e){}},
 async del(k){try{const d=await IDB.db();await new Promise(res=>{const t=d.transaction('s','readwrite');t.objectStore('s').delete(k);t.oncomplete=res;t.onerror=res;t.onabort=res;});}catch(e){}}};
const saveSession=()=>signedIn?IDB.set('sess',{K,AUTH,USER,last:Date.now()}):Promise.resolve();
async function restoreSession(){const s=await IDB.get('sess');
 if(!s||!SYNC||Date.now()-s.last>10*60*1000){if(s)await IDB.del('sess');return false;}
 const blob=localStorage.getItem('vault');if(!blob||!isV4(blob)){await IDB.del('sess');return false;}
 try{K=s.K;AUTH=s.AUTH;USER=s.USER;const o=await readV4(blob,K),v=JSON.parse(blob);WR={pw:v.pw,rec:v.rec||null};clients=o.clients;removed=o.removed;VER=+localStorage.getItem('syncver')||0;
  enter();pull().then(()=>{if($('#cl'))list();});return true;}catch(e){await IDB.del('sess');return false;}}
async function lock(){signedIn=false;await IDB.del('sess');location.reload();}

/* ---- Sync: the encrypted list lives in your own Google account, so every device shows the same clients ---- */
async function rpc(action,body={},url){const r=await fetch(url||SYNC,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,auth:AUTH,...body})});
 const j=await r.json();if(!j.ok&&j.code!=='CONFLICT'){const e=new Error(j.error||'Request failed');e.code=j.code;throw e;}return j;}
function setSync(t,bad){const s=$('#syncState');if(s){s.textContent=t;s.classList.toggle('bad',!!bad);}}
function merge(a,b){const rem={...a.removed};for(const k in b.removed)rem[k]=Math.max(rem[k]||0,b.removed[k]);const m={};
 [...a.clients,...b.clients].forEach(c=>{const o=m[c.id];if(!o||(c.upd||0)>(o.upd||0))m[c.id]=c;});
 return{clients:Object.values(m).filter(c=>!(rem[c.id]&&rem[c.id]>=(c.upd||0))),removed:rem};}
const sig=o=>JSON.stringify([o.clients.map(c=>c.id+':'+(c.upd||0)+':'+c.key+':'+c.url+':'+c.name).sort(),Object.entries(o.removed).sort()]);
async function adopt(m,ver){clients=m.clients;removed=m.removed;VER=ver;localStorage.setItem('syncver',ver);localStorage.setItem('vault',await sealText());}
function resign(msg){if(!signedIn)return;toast(msg,true);signedIn=false;setTimeout(lock,1600);}
const stale=e=>e.code==='BAD_LOGIN'?'Your login was changed on another device. Please sign in again.':(e.name==='OperationError'?'This console was updated on another device. Please sign in again.':'');
async function push(blob,retry=0){if(!AUTH||!signedIn)return;setSync('Syncing...');
 try{const j=await rpc('put',{blob:blob||localStorage.getItem('vault'),expected:VER});
  if(j.ok){VER=j.data.version;localStorage.setItem('syncver',VER);setSync('Synced');}
  else if(j.code==='CONFLICT'&&retry<2){await adopt(merge({clients,removed},await readV4(j.data.blob,K)),j.data.version);await push(null,retry+1);}}
 catch(e){const m=stale(e);if(m)return resign(m);setSync(e.code?e.message:'Saved on this device. Will sync when online.',true);}}
async function pull(){if(!AUTH||!signedIn)return;setSync('Syncing...');
 try{const j=await rpc('get');
  if(j.data.version===VER){setSync('Synced');return;}
  const remote=await readV4(j.data.blob,K),m=merge({clients,removed},remote);await adopt(m,j.data.version);
  if(sig(m)!==sig(remote))await push();else setSync('Synced');}
 catch(e){const m=stale(e);if(m)return resign(m);setSync("Offline. Using this device's copy.",true);}}
function bump(){clearTimeout(idle);idle=setTimeout(lock,10*60*1000);}
['click','keydown','touchstart'].forEach(e=>addEventListener(e,()=>{if(!signedIn)return;bump();const n=Date.now();if(n-lastSave>15000){lastSave=n;saveSession();}}));
$('#lockBtn').onclick=lock;
$('#acctBtn').onclick=()=>accountSheet();
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;checkUpdate();if(signedIn)pull().then(()=>{if($('#cl'))list();});});

/* ---- Updates reach every device by themselves: the page asks the host for the newest copy and reloads when it differs ---- */
let updating=false;
async function checkUpdate(manual){if(updating||location.protocol==='file:')return false;
 try{const r=await fetch(location.pathname+'?cb='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const m=/const BUILD='([^']+)'/.exec(await r.text());
  if(m&&m[1]!==BUILD){
   const dirty=document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)&&document.activeElement.value&&signedIn;
   if(dirty&&!manual){toast('A new version is ready. It will load when you finish typing.');return true;}
   const n=+sessionStorage.getItem('upd')||0;if(n>=3&&!manual){return true;}sessionStorage.setItem('upd',n+1);
   updating=true;toast('Updating to the newest version...');await saveSession();setTimeout(()=>location.replace(location.pathname+'?v='+encodeURIComponent(m[1])),500);return true;}
  sessionStorage.removeItem('upd');if(manual)toast('You already have the newest version.');return false;}
 catch(e){if(manual)toast('Could not check for updates right now.',true);return false;}}
setInterval(()=>{if(!document.hidden)checkUpdate();},60*1000);

/* ---- Talking to a client's backend ---- */
let pend=0;
async function busy(sel,label,fn){const b=$(sel),t=b&&b.textContent;if(b){b.disabled=true;b.textContent=label;}try{await fn();}finally{if(b&&document.body.contains(b)){b.disabled=false;b.textContent=t;}}}
async function api(c,action,body={}){pend++;$('#bar').classList.add('on');try{return await api0(c,action,body);}finally{if(!--pend)$('#bar').classList.remove('on');}}
async function api0(c,action,body={}){
 const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,builderKey:c.key,...body})});
 const j=await r.json();if(!j.ok)throw new Error(j.error||'Request failed');return j.data;}
function toast(m,bad){let h=$('#toasts');if(!h){h=document.createElement('div');h.id='toasts';document.body.append(h);}const t=document.createElement('div');t.className='toast'+(bad?' err':'');t.textContent=m;h.append(t);setTimeout(()=>t.remove(),3500);}
async function run(fn){try{return await fn();}catch(e){toast(e.message,true);}}
const T=(h,rows)=>`<div class="tw"><table class="rt"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map((c,i)=>`<td data-l="${esc(h[i]||'')}"><span class="v">${c}</span></td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}"><small>Nothing yet.</small></td></tr>`}</tbody></table></div>`;

/* ---- Sign in, create account, forgot password, upgrade ---- */
function shell(title,note,body,alt){$('#app').innerHTML=`<div class="box gate"><img class="em" src="${EM}" alt="CyberHayde emblem"><h2>${title}</h2><p class="hint"><small>${note}</small></p><form id="f" autocomplete="on">${body}<p class="err" id="err" role="alert"></p></form>${alt?`<p class="alt"><small>${alt}</small></p>`:''}<p class="ver"><small>Version ${esc(BUILD)}</small></p></div>`;}
const field=(id,label,type,extra)=>`<label for="${id}">${label}</label><input id="${id}" type="${type||'text'}" ${extra||''}>`;
const FIX='autocapitalize="none" autocorrect="off" spellcheck="false"';
function setErr(m){const e=$('#err');if(e)e.textContent=m||'';}
function enter(){signedIn=true;$('#lockBtn').hidden=false;$('#acctBtn').hidden=false;bump();lastSave=Date.now();saveSession();list();}
const needNew=(u,p,p2)=>{if(u.length<3)throw new Error('Pick a username of at least 3 characters.');if(p.length<10)throw new Error('Use at least 10 characters for the password.');if(p!==p2)throw new Error('The two passwords do not match.');};
function keepLocal(blob,ver,user){localStorage.setItem('vault',blob);localStorage.setItem('syncver',ver);if(user){USER=user;localStorage.setItem('cu',user);}}

async function startScreen(){
 if(await restoreSession())return;
 if(!SYNC){shell('Connect this console','One-time step on this device.',field('su','Console Sync address','url','placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off"')+'<div class="actions"><button class="go" id="go" type="submit">Save</button></div>','Tip: paste the address once into the SYNC_URL line at the top of this file and no device will ever ask again.');
  $('#f').onsubmit=e=>{e.preventDefault();const u=$('#su').value.trim();if(!/^https:\/\/script\.google\.com\//.test(u))return setErr('That does not look like a Google Apps Script address.');localStorage.setItem('sync',u);location.reload();};return;}
 shell('One moment...','Checking the sync service.','');
 let st=null;try{st=await rpc('status',{},SYNC);}catch(e){}
 if(!st){if(localStorage.getItem('vault')&&isV4(localStorage.getItem('vault')))return signInScreen(true);shell('Cannot reach the sync service','Check your internet connection and the sync address.','<div class="actions"><button class="go" id="go" type="submit">Try again</button></div>');$('#f').onsubmit=e=>{e.preventDefault();startScreen();};return;}
 st.data.initialised?signInScreen(false):createScreen();}
function signInScreen(offline){
 shell('Sign in',offline?'You are offline. This device can open your last saved copy.':'Use the same username and password on any device.',
  field('u','Username','text',`autocomplete="username" ${FIX} value="${esc(localStorage.getItem('cu')||'')}"`)+field('p','Password','password','autocomplete="current-password"')+'<div class="actions"><button class="go" id="go" type="submit">Sign in</button></div>',
  '<a href="#" id="fg">Forgot your password?</a> &nbsp;&middot;&nbsp; <a href="#" id="up">Old passcode-only console?</a>');
 $('#up').onclick=e=>{e.preventDefault();upgradeScreen();};$('#fg').onclick=e=>{e.preventDefault();forgotScreen();};
 $('#f').onsubmit=e=>{e.preventDefault();busy('#go','Signing in...',async()=>{try{await signIn($('#u').value,$('#p').value);}catch(x){setErr(x.message);}});};
 ($('#u').value?$('#p'):$('#u')).focus();}
async function signIn(user,pass){
 if(!user.trim()||!pass)throw new Error('Enter your username and password.');
 const secret=secretOf(user,pass);AUTH=await authPw(secret);let blob,offline=false;
 try{const j=await rpc('get');blob=j.data.blob;VER=j.data.version;}
 catch(e){if(e.code)throw new Error(e.code==='LOCKED'?e.message:'Wrong username or password.');
  blob=localStorage.getItem('vault');if(!blob||!isV4(blob))throw new Error('No connection, and nothing saved on this device yet.');offline=true;}
 if(isV4(blob)){let o;try{o=await openV4(blob,secret);}catch(e){throw new Error('Wrong username or password.');}
  clients=o.clients;removed=o.removed;keepLocal(blob,VER,user.trim());enter();setSync(offline?"Offline. Using this device's copy.":'Synced',offline);if(offline)setTimeout(()=>pull(),15000);
  if(!WR.rec&&!offline)toast('Tip: open Account and create a recovery key.');return;}
 let o;try{o=await openLegacy(blob,secret);}catch(e){throw new Error('Wrong username or password.');}
 clients=o.clients;removed=o.removed;const cur=AUTH;                                           // an account made before recovery keys existed
 const rk=newRK();rkScreen(rk,'Add a recovery key','Your console now gets a recovery key, so a forgotten password is never the end. Save it before you continue.',async()=>{await commitRekey(user.trim(),pass,rk,cur);enter();toast('Recovery key saved.');});}
async function commitRekey(u,p,rk,authCur){const secret=secretOf(u,p),raw=crypto.getRandomValues(new Uint8Array(32));K=await dkKey(raw);WR={pw:await wrapDK(raw,secret),rec:await wrapDK(raw,rk)};
 const newAuth=await authPw(secret),newRauth=await authRec(rk),blob=await sealText(),j=await rpc('rekey',{auth:authCur,newAuth,newRauth,blob,expected:VER});
 if(j.code==='CONFLICT')throw new Error('Changed on another device. Try again.');AUTH=newAuth;VER=j.data.version;keepLocal(blob,VER,u);}
function rkScreen(rk,title,note,done){
 shell(title,note,`<div class="rk" id="rk">${rkHtml(rk)}</div><div class="actions"><button type="button" class="ghost" id="rkc">Copy</button><button type="button" class="ghost" id="rkd">Download</button><button type="button" class="ghost" id="rkp">Print</button></div>
  <label class="chk"><input type="checkbox" id="rks"> <span>I have saved my recovery key somewhere safe</span></label><div class="actions"><button class="go" id="go" type="submit" disabled>Continue</button></div>`,
  'Anyone with this key can reset your password, so keep it private, like a password. It is shown only once.');
 $('#rks').onchange=()=>{$('#go').disabled=!$('#rks').checked;};
 $('#rkc').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(fmtRK(rk)).then(()=>toast('Copied')).catch(()=>toast('Select the key and copy it by hand.',true));};
 $('#rkd').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([`CyberHayde console recovery key\n\n${fmtRK(rk)}\n\nCreated ${new Date().toLocaleString()}\nKeep this private. With it, anyone can reset your console password.\n`],{type:'text/plain'}));a.download='CyberHayde-recovery-key.txt';a.click();};
 $('#rkp').onclick=()=>window.print();
 $('#f').onsubmit=e=>{e.preventDefault();busy('#go','Saving...',async()=>{try{await done();}catch(x){setErr(x.message);}});};}
function createScreen(){
 shell('Create your console account','Choose a username and password. They work on every device. Next you will get a recovery key in case you ever forget the password.',
  field('u','Username','text',`autocomplete="username" ${FIX}`)+field('p','Password (10 or more characters)','password','autocomplete="new-password"')+field('p2','Repeat password','password','autocomplete="new-password"')+'<div class="actions"><button class="go" id="go" type="submit">Continue</button></div>');
 $('#f').onsubmit=e=>{e.preventDefault();try{const u=$('#u').value.trim(),p=$('#p').value;needNew(u,p,$('#p2').value);const rk=newRK();
  rkScreen(rk,'Save your recovery key','If you forget your password, this key is the only way back in. Write it down or save it now.',async()=>{
   const secret=secretOf(u,p),raw=crypto.getRandomValues(new Uint8Array(32));K=await dkKey(raw);WR={pw:await wrapDK(raw,secret),rec:await wrapDK(raw,rk)};clients=[];removed={};AUTH=await authPw(secret);
   const blob=await sealText(),j=await rpc('init',{blob,rauth:await authRec(rk)});VER=j.data.version;keepLocal(blob,VER,u);enter();setSync('Synced');toast('Account created. Sign in with the same details on any device.');});}catch(x){setErr(x.message);}};
 $('#u').focus();}
function forgotScreen(){
 shell('Reset your password','Enter your recovery key, then choose a new username and password. Your clients are kept.',
  field('rk','Recovery key','text',`autocomplete="off" ${FIX} placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX"`)+field('u','New username','text',`autocomplete="username" ${FIX} value="${esc(localStorage.getItem('cu')||'')}"`)+field('p','New password (10 or more characters)','password','autocomplete="new-password"')+field('p2','Repeat new password','password','autocomplete="new-password"')+'<div class="actions"><button class="go" id="go" type="submit">Continue</button><button class="ghost" id="bk" type="button">Back</button></div>',
  'No recovery key either? Nothing can open the data, by design. See the note on starting fresh in the setup guide.');
 $('#bk').onclick=()=>signInScreen(false);
 $('#f').onsubmit=e=>{e.preventDefault();busy('#go','Checking...',async()=>{try{const rk=normRK($('#rk').value),u=$('#u').value.trim(),p=$('#p').value;
  if(rk.length!==24)throw new Error('The recovery key has 24 letters and numbers. Check it and try again.');needNew(u,p,$('#p2').value);
  const rauth=await authRec(rk);AUTH='';let j;try{j=await rpc('recoverGet',{rauth});}catch(x){throw new Error(x.code==='LOCKED'?x.message:'That recovery key is not right.');}
  if(!isV4(j.data.blob)||!JSON.parse(j.data.blob).rec)throw new Error('This console has no recovery key yet.');
  let raw;try{raw=await unwrapDK(JSON.parse(j.data.blob).rec,rk);}catch(x){throw new Error('That recovery key is not right.');}
  K=await dkKey(raw);const o=await readV4(j.data.blob,K);clients=o.clients;removed=o.removed;VER=j.data.version;const nrk=newRK();
  rkScreen(nrk,'Save your NEW recovery key','Your password is reset. The old recovery key no longer works, so save this new one now.',async()=>{
   const secret=secretOf(u,p);WR={pw:await wrapDK(raw,secret),rec:await wrapDK(raw,nrk)};const newAuth=await authPw(secret),newRauth=await authRec(nrk),blob=await sealText();
   const r2=await rpc('recover',{rauth,newAuth,newRauth,blob,expected:VER});if(r2.code==='CONFLICT')throw new Error('Changed on another device. Try again.');
   AUTH=newAuth;VER=r2.data.version;keepLocal(blob,VER,u);enter();toast('Password reset. You are signed in.');});}catch(x){setErr(x.message);}});};
 $('#rk').focus();}
function upgradeScreen(){
 shell('Upgrade your console','Your clients are kept. Enter your old passcode, then choose the username and password to use from now on.',
  field('op','Old passcode','password','autocomplete="off"')+field('u','New username','text',`autocomplete="username" ${FIX}`)+field('p','New password (10 or more characters)','password','autocomplete="new-password"')+field('p2','Repeat new password','password','autocomplete="new-password"')+'<div class="actions"><button class="go" id="go" type="submit">Continue</button><button class="ghost" id="bk" type="button">Back</button></div>');
 $('#bk').onclick=()=>signInScreen(false);
 $('#f').onsubmit=e=>{e.preventDefault();busy('#go','Checking...',async()=>{try{const op=$('#op').value,u=$('#u').value.trim(),p=$('#p').value;
  if(!op)throw new Error('Enter your old passcode.');needNew(u,p,$('#p2').value);
  AUTH=await authLegacy(op);const cur=AUTH;let j;try{j=await rpc('get');}catch(x){throw new Error(x.code==='LOCKED'?x.message:'That old passcode is not right.');}
  let o;try{o=await openLegacy(j.data.blob,op);}catch(x){throw new Error('That old passcode is not right.');}
  clients=o.clients;removed=o.removed;VER=j.data.version;const rk=newRK();
  rkScreen(rk,'Save your recovery key','Your console is upgraded after this step. Save the recovery key so a forgotten password is never the end.',async()=>{await commitRekey(u,p,rk,cur);enter();toast('Upgraded. Sign in with your username on any device.');});}catch(x){setErr(x.message);}});};}
async function verifyPw(cp){const s=secretOf(USER,cp);if(await authPw(s)!==AUTH)throw new Error('Your current password is not right.');return s;}
async function saveRekey(newAuth,newRauth){const blob=await sealText(),j=await rpc('rekey',{newAuth,newRauth,blob,expected:VER});if(j.code==='CONFLICT')throw new Error('Changed on another device. Try again.');AUTH=newAuth;VER=j.data.version;keepLocal(blob,VER);await saveSession();}
function accountSheet(){
 const link=SYNC_URL?location.origin+location.pathname:location.origin+location.pathname+'#s='+encodeURIComponent(SYNC);
 const d=document.createElement('div');d.className='sheet';d.innerHTML=`<div class="box"><h3 style="margin-top:0">Account</h3><p><small>Signed in as <b>${esc(USER)}</b>. Console version ${esc(BUILD)}.</small></p>

  if(u.length<3)throw new Error('Pick a username of at least 3 characters.');if(p.length<10)throw new Error('The password needs at least 10 characters.');

 $('#rkn').onclick=()=>{const pw=prompt('Type your current password to make a new recovery key:');if(!pw)return;run(async()=>{const secret=await verifyPw(pw),raw=await unwrapDK(WR.pw,secret),rk=newRK();WR.rec=await wrapDK(raw,rk);await saveRekey(AUTH,await authRec(rk));d.remove();rkSheet(rk);});};}
function rkSheet(rk){const d=document.createElement('div');d.className='sheet';d.innerHTML=`<div class="box"><h3 style="margin-top:0">Your new recovery key</h3><div class="rk">${rkHtml(rk)}</div><p><small>Save it now. It is shown only once, and the old key no longer works.</small></p><div class="actions"><button class="ghost" id="c1">Copy</button><button class="ghost" id="c2">Download</button><button class="go" id="c3">I have saved it</button></div></div>`;
 document.body.append(d);$('#c1').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(fmtRK(rk)).then(()=>toast('Copied'));};

/* ---- Screens ---- */
async function list(){cur=null;
 $('#app').innerHTML=`<div class="top"><h2>Clients</h2><button class="ghost" id="ref">Refresh</button><button id="add">Add client</button></div><div id="cl" class="cards"></div>`;
 $('#add').onclick=addClient;$('#ref').onclick=async()=>{await pull();list();};
 if(!clients.length){$('#cl').outerHTML='<div class="box" id="cl">No clients yet. Add one with its web app URL and builder key from the setup log.</div>';return;}
 $('#cl').innerHTML=clients.map((c,i)=>`<div class="client" data-i="${i}" tabindex="0" role="button" aria-label="Open ${esc(c.name)}"><h3>${esc(c.name)}</h3><span class="badge" id="b${i}"></span><small id="s${i}">Checking...</small><span class="rm" role="button" tabindex="0" data-rm="${i}">Remove</span></div>`).join('');
 const open=e=>{const r=e.target.closest('[data-rm]');
  if(r){e.stopPropagation();const i=+r.dataset.rm,c=clients[i];
   if(!confirm("Remove "+c.name+" from this list? This only removes it from your console. The client's data and app are not touched. You will need its web app URL and builder key to add it again."))return;
   removed[c.id]=Date.now();clients.splice(i,1);run(async()=>{await seal();toast(c.name+" removed");list();});return;}
  const b=e.target.closest('.client');if(b)detail(+b.dataset.i);};
 $('#cl').onclick=open;$('#cl').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(e);}};
 clients.forEach(async(c,i)=>{try{const s=await api(c,'builder.status');cache[c.id]=s;const L=s.license,el=$('#cl').children[i];if(!el)return;
  $('#b'+i).textContent=L.state;$('#b'+i).className='badge '+L.state;el.className='client '+L.state;
  $('#s'+i).textContent=(L.locked?'Locked':L.daysLeft+' days left')+(s.openPayments?`, ${s.openPayments} payment${s.openPayments>1?'s':''} to check`:'');}
  catch(e){const el=$('#cl')&&$('#cl').children[i];if(el){$('#s'+i).textContent='Cannot reach this client: '+e.message;el.className='client err';}}});}

function addClient(){$('#app').innerHTML=`<div class="box" style="max-width:560px"><h2 style="margin-top:0">Add client</h2>
 <label for="n">Business name</label><input id="n"><label for="u">Web app URL</label><input id="u" type="url" placeholder="https://script.google.com/macros/s/.../exec">
 <label for="k">Builder key</label><input id="k" type="password" autocomplete="off"><div class="actions"><button id="sv">Check and save</button><button class="ghost" id="cn">Cancel</button></div></div>`;
 $('#cn').onclick=list;$('#sv').onclick=()=>busy('#sv','Checking...',()=>run(async()=>{const c={id:crypto.randomUUID(),name:$('#n').value.trim(),url:$('#u').value.trim(),key:$('#k').value.trim(),upd:Date.now()};
  if(!c.name||!c.url||!c.key)throw new Error('Fill in all three fields.');await api(c,'builder.status');clients.push(c);await seal();toast('Client saved');list();}));}

async function detail(i){cur=clients[i];tab='overview';draw();}
async function draw(){const c=cur;
 $('#app').innerHTML=`<div class="top"><button class="ghost" id="bk">&larr; All clients</button><h2>${esc(c.name)}</h2></div>
 <div class="tabs" role="tablist">${['overview','payments','subscription','app','live','tools'].map(t=>`<button role="tab" data-t="${t}" class="${t===tab?'on':''}">${{overview:'Overview',payments:'Payments',subscription:'Subscription',app:'App settings',tools:'Tools',live:'Live view'}[t]}</button>`).join('')}</div><div id="pane">Loading...</div>`;
 $('#bk').onclick=list;document.querySelector('.tabs').onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;draw();}};
 const on=document.querySelector('.tabs .on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'});
 const pane=$('#pane');await run(async()=>{const s=await api(c,'builder.status');cache[c.id]=s;const L=s.license,S=s.settings;
 if(tab==='overview'){pane.innerHTML=`<div class="box"><div class="row"><span class="badge ${L.state}">${L.state}</span><b>${L.locked?'Locked now':L.daysLeft+' days left'}</b><small>Expiry date ${esc(L.expiry||'not set')}</small></div>
  <p>Grace days: ${L.graceDays}. Plan: ${L.price?'N'+L.price.toLocaleString()+' per '+L.periodDays+' days':'not set up'}.</p>
  <div class="grid"><div>Staff: <b>${s.counts.activeStaff}</b> of ${s.counts.staff}</div><div>Devices: <b>${s.counts.devices}</b></div><div>Items: <b>${s.counts.items}</b></div></div>
  <p><small>Last sale: ${esc(s.lastSale||'none yet')}<br>Last activity: ${esc(s.lastActivity||'none yet')}<br>Last backup: ${esc(s.lastBackup?new Date(s.lastBackup).toLocaleString():'none yet')} (weekly schedule ${s.backupOn?'on':'OFF'})</small></p>
  <div class="actions"><button id="ext">Extend days</button>${L.state==='suspended'?'<button id="rei">Reinstate</button>':'<button class="bad" id="sus">Suspend</button>'}</div></div>`;
  $('#ext').onclick=()=>run(async()=>{const d=prompt('Extend by how many days?','30');if(!d)return;await api(c,'builder.extend',{days:+d});toast('Extended');draw();});
  const sus=$('#sus'),rei=$('#rei');if(sus)sus.onclick=()=>run(async()=>{if(!confirm('Suspend '+c.name+'? Nobody can use the app until you reinstate.'))return;await api(c,'builder.suspend');toast('Suspended');draw();});
  if(rei)rei.onclick=()=>run(async()=>{await api(c,'builder.reinstate');toast('Reinstated');draw();});}
 if(tab==='payments'){const p=await api(c,'builder.payments');pane.innerHTML=p.length?`<div class="box">${T(['Submitted','Amount','Details','Status',''],[...p].sort((a,b)=>(b.Status==='Pending Review')-(a.Status==='Pending Review')).map(x=>[esc(String(x.SubmittedAt).slice(0,10)),'N'+Number(x.Amount).toLocaleString(),`${esc(x.PayDate)}<br><small>${esc(x.Reference||'no reference')}</small>`,`<b>${esc(x.Status)}</b>${x.ReviewNote?`<br><small>${esc(x.ReviewNote)}</small>`:''}`,
  `<div class="row"><button class="ghost" data-a="view" data-id="${x.PaymentID}">Receipt</button>${x.Status==='Pending Review'?`<button data-a="ok" data-id="${x.PaymentID}">Confirm</button>`:''}${x.Status==='Rejected'?'':`<button class="bad" data-a="no" data-id="${x.PaymentID}">Reject</button>`}</div>`]))}</div>`:'<div class="box">No payments yet.</div>';
  pane.onclick=e=>{const b=e.target.closest('button[data-a]');if(!b)return;const id=b.dataset.id,a=b.dataset.a;run(async()=>{
   if(a==='view'){const r=await api(c,'builder.receipt',{paymentId:id});const m=document.createElement('div');m.className='modal';m.innerHTML=`<img alt="Receipt" src="${r.dataUrl}">`;m.onclick=()=>m.remove();document.body.append(m);}
   if(a==='ok'){await api(c,'builder.confirmPayment',{paymentId:id});toast('Confirmed');draw();}
   if(a==='no'){const sus=confirm('Reject this payment and take back the days it gave. Press OK to also suspend the client, or Cancel to only reject.');await api(c,'builder.rejectPayment',{paymentId:id,suspend:sus});toast(sus?'Rejected and suspended':'Rejected');draw();}});};}
 if(tab==='subscription'||tab==='app'){const F=tab==='subscription'?[['SubscriptionExpiry','Expiry date (YYYY-MM-DD)'],['PlanPrice','Plan price (naira)'],['PlanPeriodDays','Days per payment'],['GraceDays','Grace days after expiry'],['ReminderDays','Start reminding this many days before'],['PaymentBank','Bank'],['PaymentAccountName','Account name'],['PaymentAccountNumber','Account number']]
   :[['OrgName','Business name'],['ReceiptAddress','Receipt address'],['ReceiptPhone','Receipt phone'],['ReceiptFooterNote','Receipt footer note'],['Announcement','Message shown to staff on open'],['MinAppVersion','Minimum app version'],['ForceRefreshVersion','Force refresh version']];
  pane.innerHTML=`<div class="box"><div class="grid">${F.map(([k,l])=>`<div><label for="f_${k}">${l}</label><input id="f_${k}" value="${esc(S[k]||'')}"></div>`).join('')}</div>
  ${tab==='app'?`<label for="f_RemoteConfigJSON">Remote config (JSON)</label><textarea id="f_RemoteConfigJSON" rows="5">${esc(S.RemoteConfigJSON||'{}')}</textarea>`:''}
  <div class="actions"><button id="save">Save changes</button>${tab==='app'?'<button class="ghost" id="bmp">Force all devices to refresh</button>':''}</div></div>`;
  const keys=F.map(f=>f[0]).concat(tab==='app'?['RemoteConfigJSON']:[]);
  $('#save').onclick=()=>busy('#save','Saving...',()=>run(async()=>{const ch={};keys.forEach(k=>ch[k]=$('#f_'+k).value.trim());await api(c,'builder.setConfig',{changes:ch});toast('Saved');draw();}));
  if(tab==='app')$('#bmp').onclick=()=>run(async()=>{await api(c,'builder.setConfig',{changes:{ForceRefreshVersion:String((+S.ForceRefreshVersion||0)+1)}});toast('Devices will refresh on next open');draw();});}
 if(tab==='live'){const v=await api(c,'builder.view',{limit:60}),n=x=>'₦'+Number(x||0).toLocaleString('en-NG'),tm=x=>esc(String(x||'').replace('T',' ').slice(0,16));
  pane.innerHTML=`<div class="box"><div class="row"><b class="grow">Today ${esc(v.today.date)}: ${v.today.count} sale${v.today.count===1?'':'s'}, ${n(v.today.total)}</b><button class="ghost" id="rf">Refresh</button></div></div>
  <div class="box"><h3 style="margin-top:0">Refused by the server (latest 40)</h3>${T(['When','Reason'],v.problems.map(p=>[tm(p.time),esc(p.message)]))}</div>
  <div class="box"><h3 style="margin-top:0">Recent sales</h3>${T(['Time','Receipt','Staff','Payment','Total',''],v.sales.map(s=>[tm(s.time),esc(s.id),esc(s.staff),esc(s.payment),n(s.total),s.voided?'refunded':s.offline?'made offline':'']))}</div>
  <div class="box"><h3 style="margin-top:0">Stock (${v.items.length} products)</h3>${T(['Product','Stock','Reorder at','Price','Cost','Branch'],v.items.map(i=>[esc(i.name)+(i.bundle?' (bundle)':''),i.bundle?'-':i.stock,i.reorder,n(i.price),n(i.cost),esc(i.branch||'')]))}</div>
  <div class="box"><h3 style="margin-top:0">Staff</h3>${T(['ID','Name','Role','Status'],v.staff.map(s=>[esc(s.id),esc(s.name),esc(s.role),s.active?'active':'inactive']))}
  <h3>Phones and computers</h3>${T(['Code','Added','By','Device'],v.devices.map(d=>[esc(d.code),tm(d.at),esc(d.by),esc(d.label)]))}</div>
  <div class="box"><h3 style="margin-top:0">Expenses (latest 30)</h3>${T(['Date','Category','Amount','By','Note'],v.expenses.map(e=>[esc(e.date),esc(e.category),n(e.amount),esc(e.by),esc(e.note||'')]))}</div>
  <div class="box"><h3 style="margin-top:0">Everything that happened</h3>${T(['Time','Who','Action','Details'],v.audit.map(a=>[tm(a.time),esc(a.who),esc(a.action),esc(a.details||'')]))}</div>`;
  $('#rf').onclick=draw;}
 if(tab==='tools'){const a=await api(c,'builder.audit',{limit:30});pane.innerHTML=`<div class="box"><h3 style="margin-top:0">Owner passcode</h3><div class="row"><input id="sid" value="AD-001" style="width:140px"><button id="rst">Reset passcode</button></div><p id="out"></p>
  <h3>Builder key</h3><p><button class="ghost" id="rot">Rotate key</button> <small>The old key stops working at once. The new one is saved here automatically.</small></p>
  <h3>Backup</h3><p><button class="ghost" id="bkp">Back up now</button> <small>Saves a copy of the whole Sheet in the Backups folder in your Drive.</small></p>
  <h3 style="color:var(--bad)">Danger zone</h3><p><button class="bad" id="rst2">Reset inventory data</button> <small>Erases items, stock, sales, expenses and customers on every phone. A backup copy of the Sheet is saved first.</small></p>
  <h3>Console</h3><p><button class="ghost" id="rm" style="color:var(--bad)">Remove from this console</button> <small>Does not touch the client's data.</small></p></div>
  <div class="box"><h3 style="margin-top:0">Recent activity</h3>${T(['Time','Who','Action'],a.map(r=>[esc(String(r.Timestamp).slice(0,16).replace('T',' ')),esc(r.StaffName),`${esc(r.Action)}<br><small>${esc(r.Details)}</small>`]))}</div>`;
  $('#rst').onclick=()=>run(async()=>{if(!confirm('Reset this passcode? The old one stops working.'))return;const r=await api(c,'builder.resetOwnerPasscode',{staffId:$('#sid').value.trim()});$('#out').innerHTML='New passcode: <b>'+esc(r.passcode)+'</b> <small>Shown once. Give it to the owner in person.</small>';});
  $('#rot').onclick=()=>run(async()=>{if(!confirm('Rotate the builder key?'))return;const r=await api(c,'builder.rotateKey');c.key=r.builderKey;c.upd=Date.now();await seal();toast('Key rotated and saved');});
  $('#bkp').onclick=()=>run(async()=>{await api(c,'builder.backupNow');toast('Backup saved to your Drive');draw();});
  $('#rst2').onclick=()=>run(async()=>{if(prompt('This erases ALL inventory data for '+c.name+' on every phone.\nType the business name to continue:')!==c.name)return toast('Reset cancelled. Nothing was erased.');if(prompt('Type RESET to confirm.')!=='RESET')return toast('Reset cancelled. Nothing was erased.');await api(c,'builder.resetData',{confirm:'RESET'});toast('All inventory data erased. A backup copy was saved.');draw();});
  $('#rm').onclick=()=>run(async()=>{if(!confirm('Remove '+c.name+' from this console?'))return;removed[c.id]=Date.now();clients=clients.filter(x=>x!==c);await seal();list();});}
 });}
startScreen();
</script></body></html>
